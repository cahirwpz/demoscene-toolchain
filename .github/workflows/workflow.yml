name: Demoscene Toolchain

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: cahirwpz/demoscene-toolchain:latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Download archives
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        source activate
        python3 toolchain-m68k.py --quiet download

    - name: Build toolchain
      run: |
        source activate
        python3 toolchain-m68k.py --quiet build --prefix=/opt/amiga

    - name: Build Debian package
      run: env PREFIX=/opt/amiga ./build-deb

    - name: Upload toolchain
      uses: actions/upload-artifact@v4
      with:
        name: demoscene-toolchain
        path: demoscene-toolchain_*_amd64.deb
