name: Demoscene Toolchain

on:
  push:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # draft releases are only listed with push access
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
    - name: Pick release version
      id: version
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        DATE=$(date -u +%Y.%m.%d)
        TAKEN=$( { gh api --paginate "repos/$GH_REPO/releases" -q '.[].tag_name'
                   gh api --paginate "repos/$GH_REPO/tags" -q '.[].name'; } | sort -u)
        N=1
        TAG=${DATE//./-}
        while grep -qx "$TAG" <<< "$TAKEN"; do
          N=$((N + 1))
          TAG=${DATE//./-}-$N
        done
        echo "version=$DATE+$N" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    container: cahirwpz/demoscene-toolchain:ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Download archives
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        ./toolchain-m68k --quiet download

    - name: Build toolchain
      run: ./toolchain-m68k --quiet build --prefix=/opt/amiga

    - name: Build Debian package
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: env PREFIX=/opt/amiga ./build-deb

    - name: Upload toolchain
      uses: actions/upload-artifact@v4
      with:
        name: demoscene-toolchain
        path: demoscene-toolchain_*_amd64.deb

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: demoscene-toolchain

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.version.outputs.version }}
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        gh release create "$TAG" "demoscene-toolchain_${VERSION}_amd64.deb" \
          --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
