name: Demoscene Toolchain

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: cahirwpz/demoscene-toolchain:ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Download archives
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        ./toolchain-m68k --quiet download

    - name: Build toolchain
      run: ./toolchain-m68k --quiet build --prefix=/opt/amiga

    - name: Build Debian package
      run: env PREFIX=/opt/amiga ./build-deb

    - name: Upload toolchain
      uses: actions/upload-artifact@v4
      with:
        name: demoscene-toolchain
        path: demoscene-toolchain_*_amd64.deb

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: demoscene-toolchain

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)
        TAG=$(echo "${VERSION%+*}" | tr . -)
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null ||
           gh release view "$TAG" >/dev/null 2>&1; then
          echo "::error::Release $TAG already exists; add a debian/changelog entry first."
          exit 1
        fi
        gh release create "$TAG" "demoscene-toolchain_${VERSION}_amd64.deb" \
          --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
